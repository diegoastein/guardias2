<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Pagos - Conciliación Completa</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyB6AKWdDANzAjr5OHeskhT_KF_Gyco2fVY",
            authDomain: "guardias-5c5d9.firebaseapp.com",
            projectId: "guardias-5c5d9",
            storageBucket: "guardias-5c5d9.firebasestorage.app",
            messagingSenderId: "954058300552",
            appId: "1:954058300552:web:00135945002743e223d33d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        function App() {
            const [medicos, setMedicos] = useState([]);
            const [guardias, setGuardias] = useState({});
            const [pagos, setPagos] = useState({});
            const [mesSeleccionado, setMesSeleccionado] = useState(new Date().toISOString().slice(0, 7));
            const [medicoIdSeleccionado, setMedicoIdSeleccionado] = useState('');

            useEffect(() => {
                signInAnonymously(auth);
                onSnapshot(collection(db, 'medicos'), (snap) => setMedicos(snap.docs.map(d => ({ ...d.data(), id: d.id }))));
                onSnapshot(collection(db, 'guardias'), (snap) => {
                    const d = {}; snap.docs.forEach(x => d[x.id] = x.data()); setGuardias(d);
                });
                onSnapshot(collection(db, 'pagos_control'), (snap) => {
                    const d = {}; snap.docs.forEach(x => d[x.id] = x.data()); setPagos(d);
                });
            }, []);

            const guardiasFiltradas = useMemo(() => {
                const results = [];
                Object.entries(guardias).forEach(([fecha, data]) => {
                    if (fecha.startsWith(mesSeleccionado)) {
                        const slots = [
                            { s: data.dia1, n: 'Día 1' }, { s: data.dia2, n: 'Día 2' },
                            { s: data.noche1, n: 'Noche 1' }, { s: data.noche2, n: 'Noche 2' }
                        ];

                        slots.forEach((slot, index) => {
                            const s = slot.s;
                            if (s?.estado === 'CUBIERTA' && s?.tipoPago === 'SISTEMA') {
                                const idCobrador = s.prestadorId || s.medicoId;
                                const esReemplazo = s.prestadorId && (s.prestadorId !== s.medicoId);
                                const esVacante = s.nota?.toLowerCase().includes('vacante') || !s.medicoId;

                                if (esReemplazo || esVacante) {
                                    results.push({
                                        id: `${fecha}-${index}`,
                                        fecha,
                                        turno: slot.n,
                                        medicoQueHizo: s.medicoId,
                                        idCobrador,
                                        motivo: esVacante ? 'VACANTE' : `REEMPLAZO DE ${medicos.find(m => String(m.id) === String(s.medicoId))?.nombre || 'TITULAR'}`,
                                        cobrado: pagos[`${mesSeleccionado}-${fecha}-${index}`]?.cobrado || false
                                    });
                                }
                            }
                        });
                    }
                });
                return results;
            }, [guardias, medicos, mesSeleccionado, pagos]);

            const medicosConActividad = useMemo(() => {
                const ids = [...new Set(guardiasFiltradas.map(g => g.idCobrador))];
                return medicos.filter(m => ids.includes(String(m.id))).sort((a,b) => a.nombre.localeCompare(b.nombre));
            }, [guardiasFiltradas, medicos]);

            const togglePago = async (guardiaId) => {
                const docId = `${mesSeleccionado}-${guardiaId}`;
                await setDoc(doc(db, 'pagos_control', docId), { cobrado: !pagos[docId]?.cobrado });
            };

            const guardiasDelMedico = guardiasFiltradas.filter(g => String(g.idCobrador) === String(medicoIdSeleccionado));
            const pendientes = guardiasDelMedico.filter(g => !g.cobrado);
            const pagadas = guardiasDelMedico.filter(g => g.cobrado);

            return (
                <div className="max-w-4xl mx-auto p-6">
                    <div className="bg-white rounded-xl shadow-lg p-6 mb-6 border-t-4 border-indigo-600">
                        <h1 className="text-2xl font-bold text-slate-800">Panel de Pagos</h1>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                            <input type="month" className="border rounded-lg p-3 outline-none focus:ring-2 focus:ring-indigo-500" 
                                value={mesSeleccionado} onChange={(e) => setMesSeleccionado(e.target.value)} />
                            <select className="border rounded-lg p-3 outline-none focus:ring-2 focus:ring-indigo-500"
                                value={medicoIdSeleccionado} onChange={(e) => setMedicoIdSeleccionado(e.target.value)}>
                                <option value="">Seleccionar Médico...</option>
                                {medicosConActividad.map(m => <option key={m.id} value={m.id}>{m.nombre}</option>)}
                            </select>
                        </div>
                    </div>

                    {medicoIdSeleccionado && (
                        <div className="space-y-6">
                            {/* SECCIÓN PENDIENTES */}
                            <div className="bg-white rounded-xl shadow-md overflow-hidden border-l-4 border-red-400">
                                <div className="bg-red-50 px-6 py-3 border-b border-red-100">
                                    <h2 className="text-red-700 font-bold text-sm uppercase tracking-wider">Guardias Pendientes de Cobro</h2>
                                </div>
                                <table className="w-full text-sm">
                                    <tbody className="divide-y divide-slate-100">
                                        {pendientes.length === 0 ? <tr><td className="p-6 text-slate-400 italic text-center">No hay pendientes</td></tr> :
                                         pendientes.map(g => (
                                            <tr key={g.id} className="hover:bg-slate-50">
                                                <td className="px-6 py-4 font-bold text-slate-700">{g.fecha.split('-').reverse().join('/')} <span className="text-xs font-normal text-slate-400">({g.turno})</span></td>
                                                <td className="px-6 py-4 text-xs font-semibold text-slate-500">{g.motivo}</td>
                                                <td className="px-6 py-4 text-right">
                                                    <button onClick={() => togglePago(g.id)} className="bg-white border border-red-200 text-red-600 px-4 py-1 rounded-full text-xs font-bold hover:bg-red-600 hover:text-white transition">MARCAR COBRADA</button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>

                            {/* SECCIÓN PAGADAS */}
                            <div className="bg-white rounded-xl shadow-md overflow-hidden border-l-4 border-green-500">
                                <div className="bg-green-50 px-6 py-3 border-b border-green-100">
                                    <h2 className="text-green-700 font-bold text-sm uppercase tracking-wider">Historial de Guardias Pagadas</h2>
                                </div>
                                <table className="w-full text-sm">
                                    <tbody className="divide-y divide-slate-100">
                                        {pagadas.length === 0 ? <tr><td className="p-6 text-slate-400 italic text-center">No hay guardias pagadas</td></tr> :
                                         pagadas.map(g => (
                                            <tr key={g.id} className="bg-green-50/30">
                                                <td className="px-6 py-4 font-bold text-green-700">{g.fecha.split('-').reverse().join('/')} <span className="text-xs font-normal text-green-400">({g.turno})</span></td>
                                                <td className="px-6 py-4 text-xs font-semibold text-green-600/70">{g.motivo}</td>
                                                <td className="px-6 py-4 text-right">
                                                    <button onClick={() => togglePago(g.id)} className="text-green-600 font-bold text-xs flex items-center justify-end gap-1 hover:underline">✓ PAGADA (Deshacer)</button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    <div className="mt-8 bg-slate-900 rounded-xl p-6 text-white shadow-xl">
                        <h2 className="text-orange-400 font-bold text-xs uppercase tracking-widest mb-4">Deudas Generales del Mes</h2>
                        {guardiasFiltradas.filter(g => !g.cobrado).map(g => (
                            <div key={g.id} className="flex justify-between border-b border-slate-700 py-2 text-xs">
                                <span>{medicos.find(m => String(m.id) === String(g.idCobrador))?.nombre}</span>
                                <span className="text-slate-500">{g.fecha.split('-').reverse().join('/')}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
