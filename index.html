<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Pagos - Versión Corregida</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyB6AKWdDANzAjr5OHeskhT_KF_Gyco2fVY",
            authDomain: "guardias-5c5d9.firebaseapp.com",
            projectId: "guardias-5c5d9",
            storageBucket: "guardias-5c5d9.firebasestorage.app",
            messagingSenderId: "954058300552",
            appId: "1:954058300552:web:00135945002743e223d33d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        function App() {
            const [medicos, setMedicos] = useState([]);
            const [guardias, setGuardias] = useState({});
            const [pagos, setPagos] = useState({});
            const [mesSeleccionado, setMesSeleccionado] = useState("2025-01"); // Forzado a Enero para probar
            const [medicoIdSeleccionado, setMedicoIdSeleccionado] = useState('');

            useEffect(() => {
                signInAnonymously(auth);
                onSnapshot(collection(db, 'medicos'), (snap) => setMedicos(snap.docs.map(d => ({ ...d.data(), id: d.id }))));
                onSnapshot(collection(db, 'guardias'), (snap) => {
                    const d = {}; snap.docs.forEach(x => d[x.id] = x.data()); setGuardias(d);
                });
                onSnapshot(collection(db, 'pagos_control'), (snap) => {
                    const d = {}; snap.docs.forEach(x => d[x.id] = x.data()); setPagos(d);
                });
            }, []);

            const guardiasFiltradas = useMemo(() => {
                const results = [];
                Object.entries(guardias).forEach(([fecha, data]) => {
                    if (fecha.startsWith(mesSeleccionado)) {
                        const slots = [
                            { s: data.dia1, n: 'Día 1' }, { s: data.dia2, n: 'Día 2' },
                            { s: data.noche1, n: 'Noche 1' }, { s: data.noche2, n: 'Noche 2' }
                        ];

                        slots.forEach((slot, index) => {
                            const s = slot.s;
                            // Criterio: Está cubierta, es de sistema y tiene un receptor de cobro (prestador o medicoId)
                            if (s?.estado === 'CUBIERTA' && s?.tipoPago === 'SISTEMA') {
                                const idCobrador = s.prestadorId || s.medicoId;
                                
                                // Si hay prestadorId SIEMPRE es un reemplazo/derivación
                                // Si NO hay prestadorId, verificamos si es una vacante o si simplemente no se grabó el titular
                                const esDerivada = s.prestadorId && (s.prestadorId !== s.medicoId);
                                const esVacante = s.estado === 'VACANTE' || !s.medicoId;

                                // Para asegurar que no falten médicos como Sánchez o Abdenur, 
                                // incluimos toda guardia que tenga un prestadorId asignado 
                                // O que el médico que la hizo NO sea el mismo que cobra
                                if (idCobrador) {
                                    results.push({
                                        id: `${fecha}-${index}`,
                                        fecha,
                                        turno: slot.n,
                                        medicoQueHizo: s.medicoId,
                                        idCobrador: idCobrador,
                                        motivo: esDerivada ? `REEMPLAZO / DERIVACIÓN` : (esVacante ? "VACANTE" : "GUARDIA EXTRA"),
                                        cobrado: pagos[`${mesSeleccionado}-${fecha}-${index}`]?.cobrado || false
                                    });
                                }
                            }
                        });
                    }
                });
                return results;
            }, [guardias, medicos, mesSeleccionado, pagos]);

            const medicosConActividad = useMemo(() => {
                const ids = [...new Set(guardiasFiltradas.map(g => g.idCobrador))];
                return medicos.filter(m => ids.includes(String(m.id))).sort((a,b) => a.nombre.localeCompare(b.nombre));
            }, [guardiasFiltradas, medicos]);

            const togglePago = async (guardiaId) => {
                const docId = `${mesSeleccionado}-${guardiaId}`;
                await setDoc(doc(db, 'pagos_control', docId), { cobrado: !pagos[docId]?.cobrado });
            };

            const guardiasDelMedico = guardiasFiltradas.filter(g => String(g.idCobrador) === String(medicoIdSeleccionado));

            return (
                <div className="max-w-4xl mx-auto p-6">
                    <div className="bg-white rounded-xl shadow-lg p-6 mb-6 border-t-4 border-indigo-600">
                        <h1 className="text-2xl font-bold text-slate-800">Control de Pagos (Enero disponible)</h1>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                            <input type="month" className="border rounded-lg p-3 outline-none focus:ring-2 focus:ring-indigo-500" 
                                value={mesSeleccionado} onChange={(e) => setMesSeleccionado(e.target.value)} />
                            <select className="border rounded-lg p-3 outline-none focus:ring-2 focus:ring-indigo-500"
                                value={medicoIdSeleccionado} onChange={(e) => setMedicoIdSeleccionado(e.target.value)}>
                                <option value="">Seleccionar Médico ({medicosConActividad.length} encontrados)...</option>
                                {medicosConActividad.map(m => <option key={m.id} value={m.id}>{m.nombre}</option>)}
                            </select>
                        </div>
                    </div>

                    {medicoIdSeleccionado ? (
                        <div className="space-y-4">
                            {guardiasDelMedico.map(g => (
                                <div key={g.id} className={`flex justify-between items-center p-4 rounded-lg shadow-sm border ${g.cobrado ? 'bg-green-50 border-green-200' : 'bg-white border-slate-200'}`}>
                                    <div>
                                        <div className={`font-bold ${g.cobrado ? 'text-green-700' : 'text-slate-700'}`}>{g.fecha.split('-').reverse().join('/')} - {g.turno}</div>
                                        <div className="text-xs text-slate-500 uppercase font-bold">{g.motivo}</div>
                                    </div>
                                    <button onClick={() => togglePago(g.id)} className={`px-4 py-2 rounded-full text-xs font-bold transition ${g.cobrado ? 'bg-green-600 text-white' : 'bg-slate-100 text-slate-600 border'}`}>
                                        {g.cobrado ? '✓ PAGADA' : 'MARCAR PAGO'}
                                    </button>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="text-center p-10 bg-white rounded-xl border-2 border-dashed text-slate-400">
                            Seleccione un médico para ver sus guardias de reemplazo o vacantes.
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
