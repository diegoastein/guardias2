<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Pagos - Guardias Pediátricas</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

        const { useState, useEffect, useMemo } = React;

        // Credenciales originales extraídas de index.html
        const firebaseConfig = {
            apiKey: "AIzaSyB6AKWdDANzAjr5OHeskhT_KF_Gyco2fVY",
            authDomain: "guardias-5c5d9.firebaseapp.com",
            projectId: "guardias-5c5d9",
            storageBucket: "guardias-5c5d9.firebasestorage.app",
            messagingSenderId: "954058300552",
            appId: "1:954058300552:web:00135945002743e223d33d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        function App() {
            const [medicos, setMedicos] = useState([]);
            const [guardias, setGuardias] = useState({});
            const [pagos, setPagos] = useState({}); // Nueva colección para persistir el estado de cobro
            const [mesSeleccionado, setMesSeleccionado] = useState(new Date().toISOString().slice(0, 7));
            const [medicoIdSeleccionado, setMedicoIdSeleccionado] = useState('');

            // Listeners de datos
            useEffect(() => {
                signInAnonymously(auth);
                const unsubMedicos = onSnapshot(collection(db, 'medicos'), (snap) => setMedicos(snap.docs.map(d => ({ ...d.data(), id: d.id }))));
                const unsubGuardias = onSnapshot(collection(db, 'guardias'), (snap) => {
                    const d = {}; snap.docs.forEach(x => d[x.id] = x.data()); setGuardias(d);
                });
                const unsubPagos = onSnapshot(collection(db, 'pagos_control'), (snap) => {
                    const d = {}; snap.docs.forEach(x => d[x.id] = x.data()); setPagos(d);
                });
                return () => { unsubMedicos(); unsubGuardias(); unsubPagos(); };
            }, []);

            // Lógica para filtrar guardias del mes y determinar quién debe cobrar
            const guardiasDelMes = useMemo(() => {
                const results = [];
                Object.entries(guardias).forEach(([fecha, data]) => {
                    if (fecha.startsWith(mesSeleccionado)) {
                        const slots = [data.dia1, data.dia2, data.noche1, data.noche2];
                        slots.forEach((slot, index) => {
                            if (slot && slot.estado === 'CUBIERTA' && slot.tipoPago === 'SISTEMA') {
                                // Quien cobra es el prestadorId si existe, sino el medicoId
                                const idCobrador = slot.prestadorId || slot.medicoId;
                                results.push({
                                    id: `${fecha}-${index}`,
                                    fecha,
                                    turno: index < 2 ? 'Día' : 'Noche',
                                    medicoRealizo: slot.medicoId,
                                    idCobrador,
                                    esDerivada: !!slot.prestadorId && slot.prestadorId !== slot.medicoId
                                });
                            }
                        });
                    }
                });
                return results;
            }, [guardias, mesSeleccionado]);

            // Médicos que tienen guardias a cobrar este mes
            const medicosConCobros = useMemo(() => {
                const ids = [...new Set(guardiasDelMes.map(g => g.idCobrador))];
                return medicos.filter(m => ids.includes(String(m.id))).sort((a,b) => a.nombre.localeCompare(b.nombre));
            }, [guardiasDelMes, medicos]);

            const togglePago = async (guardiaId) => {
                const docId = `${mesSeleccionado}-${guardiaId}`;
                const estadoActual = pagos[docId]?.cobrado || false;
                await setDoc(doc(db, 'pagos_control', docId), { cobrado: !estadoActual });
            };

            const guardiasDelMedico = guardiasDelMes.filter(g => String(g.idCobrador) === String(medicoIdSeleccionado));

            return (
                <div className="max-w-5xl mx-auto p-4 sm:p-8">
                    <header className="mb-8 border-b pb-4">
                        <h1 className="text-2xl font-bold text-blue-700">Control de Pagos de Guardias</h1>
                        <p className="text-gray-600 italic">Módulo administrativo de conciliación</p>
                    </header>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                        <div className="bg-white p-4 rounded shadow">
                            <label className="block text-sm font-bold mb-2">Seleccionar Mes:</label>
                            <input type="month" className="w-full border p-2 rounded" 
                                value={mesSeleccionado} onChange={(e) => {setMesSeleccionado(e.target.value); setMedicoIdSeleccionado('');}} />
                        </div>
                        <div className="bg-white p-4 rounded shadow">
                            <label className="block text-sm font-bold mb-2">Médico a Controlar:</label>
                            <select className="w-full border p-2 rounded" 
                                value={medicoIdSeleccionado} onChange={(e) => setMedicoIdSeleccionado(e.target.value)}>
                                <option value="">Seleccione un médico...</option>
                                {medicosConCobros.map(m => <option key={m.id} value={m.id}>{m.nombre}</option>)}
                            </select>
                        </div>
                    </div>

                    {medicoIdSeleccionado && (
                        <div className="bg-white rounded shadow overflow-hidden mb-8">
                            <table className="w-full text-left">
                                <thead className="bg-blue-50">
                                    <tr>
                                        <th className="p-3 border-b text-sm">Fecha</th>
                                        <th className="p-3 border-b text-sm">Turno</th>
                                        <th className="p-3 border-b text-sm">Información de Cobro</th>
                                        <th className="p-3 border-b text-sm text-center">¿Cobró?</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {guardiasDelMedico.map(g => {
                                        const cobrado = pagos[`${mesSeleccionado}-${g.id}`]?.cobrado;
                                        const medicoHizo = medicos.find(m => String(m.id) === String(g.medicoRealizo))?.nombre;
                                        return (
                                            <tr key={g.id} className={cobrado ? "bg-green-50" : ""}>
                                                <td className="p-3 border-b">{g.fecha.split('-').reverse().join('/')}</td>
                                                <td className="p-3 border-b">{g.turno}</td>
                                                <td className="p-3 border-b text-xs">
                                                    {g.esDerivada ? (
                                                        <span className="text-orange-600 font-medium">
                                                            Derivada de: {medicoHizo}
                                                        </span>
                                                    ) : "Guardia Propia / Extra"}
                                                </td>
                                                <td className="p-3 border-b text-center">
                                                    <input type="checkbox" className="w-5 h-5 cursor-pointer" 
                                                        checked={cobrado || false} onChange={() => togglePago(g.id)} />
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    )}

                    <div className="bg-gray-800 text-white p-6 rounded-lg shadow-lg">
                        <h2 className="text-xl font-bold mb-4 border-b border-gray-600 pb-2">Informe de Deudas del Mes</h2>
                        <div className="space-y-2">
                            {guardiasDelMes.filter(g => !pagos[`${mesSeleccionado}-${g.id}`]?.cobrado).length === 0 ? (
                                <p className="text-green-400 font-medium">✓ Todos los pagos del mes están al día.</p>
                            ) : (
                                guardiasDelMes.filter(g => !pagos[`${mesSeleccionado}-${g.id}`]?.cobrado).map(g => {
                                    const cobrador = medicos.find(m => String(m.id) === String(g.idCobrador))?.nombre;
                                    return (
                                        <div key={g.id} className="flex justify-between border-b border-gray-700 py-1 text-sm">
                                            <span><span className="text-red-400 font-bold">{cobrador}</span> - {g.fecha.split('-').reverse().join('/')} ({g.turno})</span>
                                            <span className="text-gray-400 italic">Pendiente</span>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
